<svg xmlns="http://www.w3.org/2000/svg" width="320" height="50" viewBox="0 0 320 50" role="img" aria-labelledby="note">
  <title id="note">keeping the little things that make an ordinary day feel softer.</title>
  <style>
    .first { fill: #85375b; }
    .rest { fill: #70448b; }
    @media (prefers-color-scheme: dark) {
      .first { fill: #efb6ce; }
      .rest { fill: #d8c0ee; }
    }
  </style>
  <g text-anchor="middle" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="15">
    <text x="160" y="21" class="first">keeping the little things</text>
    <text class="rest" font-style="italic"><tspan x="160" y="41">that make an ordinary day feel softer.</tspan></text>
  </g>
</svg>
